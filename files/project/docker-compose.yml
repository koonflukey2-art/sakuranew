services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sakuranew}
      POSTGRES_USER: ${POSTGRES_USER:-sakuranew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    env_file:
    - .env
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads/statements}
      NODE_ENV: ${NODE_ENV:-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
    - db
    ports:
    - 127.0.0.1:3000:3000
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 1536m
    cpus: 1.5
    volumes:
    - /opt/sakuranew/data/uploads:/data/uploads
volumes:
  pgdata: null
