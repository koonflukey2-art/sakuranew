services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sakuranew}
      POSTGRES_USER: ${POSTGRES_USER:-sakuranew}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - pgdata:/var/lib/postgresql/data
  app:
    build: .
    restart: unless-stopped
    env_file:
    - .env
    environment:
      UPLOAD_DIR: ${UPLOAD_DIR:-/data/uploads/statements}
      NODE_ENV: ${NODE_ENV:-production}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      AUTH_URL: ${AUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      AUTH_SECRET: ${AUTH_SECRET}
    depends_on:
    - db
    ports:
    - 127.0.0.1:3000:3000
    volumes:
    - /opt/sakuranew/data/uploads:/data/uploads
volumes:
  pgdata: null
