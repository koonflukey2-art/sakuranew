# HTTP-level zones + maps (must be included inside http { ... })

# Map cookie presence for auth-gated endpoints
map $http_cookie $has_cookie {
  default 0;
  "" 0;
  "~.+" 1;
}

# Rate limit zones
limit_req_zone $binary_remote_addr zone=webhook_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=ai_zone:10m rate=2r/s;
limit_req_zone $binary_remote_addr zone=presence_zone:10m rate=5r/s;
limit_req_zone $binary_remote_addr zone=notif_zone:10m rate=2r/s;

# Connection limit per IP
limit_conn_zone $binary_remote_addr zone=perip_conn:10m;
